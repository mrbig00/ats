# Single Prometheus server (replaces mimir-distributed on small k3s nodes).
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: false

# Host / node metrics — must use host network/PID so counters match the real machine.
prometheus-node-exporter:
  enabled: true
  fullnameOverride: node-exporter
  hostNetwork: true
  hostPID: true
  dnsPolicy: ClusterFirstWithHostNet
  hostRootFsMount:
    enabled: true
    mountPropagation: HostToContainer
  rbac:
    pspEnabled: false
  tolerations:
    - effect: NoSchedule
      operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    port: 9100
  extraArgs:
    - --path.rootfs=/host
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)
    - --collector.netdev.device-exclude=^(veth|kube|br-|cni|flannel|calico|docker).*

configmapReload:
  prometheus:
    enabled: false

server:
  name: server
  replicaCount: 1
  retention: 7d
  extraFlags:
    - web.enable-lifecycle
    - web.enable-remote-write-receiver
  service:
    enabled: true
    type: ClusterIP
    servicePort: 9090
  readinessProbeInitialDelay: 15
  livenessProbeInitialDelay: 30
  persistentVolume:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Replace chart defaults (kubernetes-* jobs scrape via Service and break dashboard 1860).
serverFiles:
  prometheus.yml:
    rule_files: []
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - 127.0.0.1:9090

      # Scrape each node-exporter pod on the node (hostNetwork → real host interfaces & disks).
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - observability
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: prometheus-node-exporter
            action: keep
          # Dashboard 1860 uses instance == nodename (not pod IP).
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: nodename
