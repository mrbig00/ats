# One-time cluster setup: replace the email below (Let's Encrypt account contact), then apply:
#   kubectl apply -f kubernetes/cluster-issuer-letsencrypt-prod.yaml
#
# Requires cert-manager ( https://cert-manager.io/docs/installation/kubernetes/ ).
# Port 80 for this hostname must reach Traefik so HTTP-01 validation can succeed.
# If certificate orders stay Pending, check cert-manager solves use this ingressClassName or
# try `class: traefik` instead of ingressClassName (older cert-manager / Traefik).

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mrbig00@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
