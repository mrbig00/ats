# Create secrets before apply: copy postgres-secret.env.example → postgres-secret.env
# (and laravel-secret.env.example → laravel-secret.env), fill values, never commit *.env files.
#   kubectl create secret generic postgres-secret --from-env-file=kubernetes/postgres-secret.env
#   kubectl create secret generic ats-laravel-secret --from-env-file=kubernetes/laravel-secret.env
# If you previously set APP_KEY only on the Deployment (not in the secret), patch the secret so
# ats-laravel-secret.APP_KEY matches that value before rolling, or sessions/decryption break.
# TLS: install cert-manager, apply kubernetes/cluster-issuer-letsencrypt-prod.yaml (edit email first),
# then apply this manifest; Ingress requests a cert via HTTP-01 into Secret ats-tls.
#
# HTTP→HTTPS: Middleware ats-https-redirect is attached only to this Ingress so ACME solver
# ingresses can still use plain HTTP on port 80. If you kubectl apply -n foo (not default),
# set Ingress annotation traefik.ingress.kubernetes.io/router.middlewares to
# "foo-ats-https-redirect@kubernetescrd". Older Traefik/k3s: if Middleware rejects apiVersion,
# try apiVersion traefik.containo.us/v1alpha1 instead of traefik.io/v1alpha1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  POSTGRES_DB: ats
  POSTGRES_USER: ats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ats-postgres
  labels:
    app: ats-postgres
spec:
  serviceName: ats-postgres
  replicas: 1
  selector:
    matchLabels:
      app: ats-postgres
  template:
    metadata:
      labels:
        app: ats-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ats
                - -d
                - ats
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ats
                - -d
                - ats
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: ats-postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: ats-postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ats-postgres
  labels:
    app: ats-postgres
spec:
  type: ClusterIP
  selector:
    app: ats-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ats-laravel-storage
  labels:
    app: ats-laravel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats
  labels:
    app: ats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats
  template:
    metadata:
      labels:
        app: ats
    spec:
      # www-data in PHP image is typically UID 33; fsGroup makes volume writable by that group
      securityContext:
        fsGroup: 33
      initContainers:
        # Create storage directory structure on PVC and set ownership for Laravel (www-data = 33:33)
        - name: storage-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /storage/app/public
              mkdir -p /storage/logs
              mkdir -p /storage/framework/cache /storage/framework/sessions /storage/framework/views
              chown -R 33:33 /storage
          volumeMounts:
            - name: laravel-storage
              mountPath: /storage
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
        - name: laravel
          imagePullPolicy: Always
          image: ghcr.io/mrbig00/ats:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          env:
            # Application
            - name: APP_NAME
              value: "ATS"
            - name: APP_ENV
              value: preprod
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: APP_KEY
            - name: APP_DEBUG
              value: "true"
            - name: APP_URL
              value: "https://ats.k3s.szanto-zoltan.com"

            # Database
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: ats-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: AUTORUN_ENABLED
              value: "true"

            # Cache & Session
            - name: CACHE_STORE
              value: redis
            - name: SESSION_DRIVER
              value: redis
            - name: QUEUE_CONNECTION
              value: database

            # Logging (JSON stderr for Loki trace/log correlation)
            - name: LOG_CHANNEL
              value: stderr
            - name: LOG_LEVEL
              value: info
            - name: LOG_STDERR_FORMATTER
              value: Monolog\Formatter\JsonFormatter

            # OpenTelemetry → Alloy → Tempo / Loki / Mimir
            - name: OTEL_SERVICE_NAME
              value: ats
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_PHP_AUTOLOAD_ENABLED
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=preprod
            - name: OTEL_TRACES_SAMPLER_TYPE
              value: traceidratio
            - name: OTEL_TRACES_SAMPLER_TRACEIDRATIO_RATIO
              value: "0.25"

            # Broadcasting & Queue
            - name: BROADCAST_CONNECTION
              value: log

            # Object storage (candidate documents)
            - name: MEDIA_DISK
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: MEDIA_DISK
                  optional: true
            - name: LIVEWIRE_TEMPORARY_FILE_UPLOAD_DISK
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: LIVEWIRE_TEMPORARY_FILE_UPLOAD_DISK
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: AWS_DEFAULT_REGION
                  optional: true
            - name: AWS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: AWS_BUCKET
                  optional: true
            - name: AWS_URL
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: AWS_URL
                  optional: true
            - name: AWS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: AWS_ENDPOINT
                  optional: true
            - name: AWS_USE_PATH_STYLE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ats-laravel-secret
                  key: AWS_USE_PATH_STYLE_ENDPOINT
                  optional: true
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/html/storage/app
              subPath: app
            - name: laravel-storage
              mountPath: /var/www/html/storage/logs
              subPath: logs
            - name: laravel-storage
              mountPath: /var/www/html/storage/framework/cache
              subPath: framework/cache
            - name: laravel-storage
              mountPath: /var/www/html/storage/framework/sessions
              subPath: framework/sessions
            - name: laravel-storage
              mountPath: /var/www/html/storage/framework/views
              subPath: framework/views
      volumes:
        - name: laravel-storage
          persistentVolumeClaim:
            claimName: ats-laravel-storage
---
apiVersion: v1
kind: Service
metadata:
  name: ats
  labels:
    app: ats
spec:
  type: ClusterIP
  selector:
    app: ats
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ats-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ats-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-ats-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ats.k3s.szanto-zoltan.com
        - ats.hzstrade.ro
      secretName: ats-tls
  rules:
    - host: ats.k3s.szanto-zoltan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ats
                port:
                  number: 80
    - host: ats.hzstrade.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ats
                port:
                  number: 80
