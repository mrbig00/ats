# Deploy the app to Kubernetes after a successful image build on main.
#
# Prerequisites (repository Settings → Secrets → Actions):
# - KUBECONFIG: full kubeconfig contents for the cluster (see plan / k3s docs).
#   The Kubernetes API server must be reachable from GitHub-hosted runners.
#
name: Deploy to Kubernetes

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Docker image
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_SECRET" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: kubectl sanity check
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Apply manifests
        run: kubectl apply -f kubernetes/app.yaml

      - name: Rollout restart deployment
        run: kubectl rollout restart deployment/ats

      - name: Wait for rollout
        run: kubectl rollout status deployment/ats --timeout=5m

      - name: Debug on failure
        if: failure()
        run: |
          kubectl describe deployment/ats || true
          kubectl logs deployment/ats -c laravel --tail=200 || true
