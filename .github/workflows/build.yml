name: Build Docker image

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute APP_VERSION
        id: app_version
        env:
          GIT_BRANCH_LABEL: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          short_sha="$(git rev-parse --short HEAD)"
          branch="$GIT_BRANCH_LABEL"
          [ -z "$branch" ] && branch="unknown"
          slug_chunk() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//'
          }
          branch_slug="$(slug_chunk "$branch")"
          short_slug="$(slug_chunk "$short_sha")"
          [ -z "$branch_slug" ] && branch_slug="unknown"
          [ -z "$short_slug" ] && short_slug="unknown"
          version="${branch_slug}-${short_slug}"
          echo "APP_VERSION=${version}"
          printf 'version=%s\n' "${version}" >>"$GITHUB_OUTPUT"

      - name: Extract metadata and build
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ats
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: production.Dockerfile
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max